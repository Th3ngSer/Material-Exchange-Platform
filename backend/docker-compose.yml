services:
  mongo:
    image: mongo:7
    container_name: materialx-mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: materialx-backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/material_xchange?replicaSet=rs0
      JWT_SECRET: dev_secret_change_me
      JWT_EXPIRES_IN: 1d
    ports:
      - '3000:3000'

volumes:
  mongo_data:
